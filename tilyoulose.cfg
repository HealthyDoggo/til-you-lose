// Til You Lose - default settings
// Dropped into bakkesmod\cfg\ by the loader when the plugin first runs.

plugin load TilYouLose

// Master switch
tyl_enabled 1

// Default: ranked 1v1, 2v2, 3v3. Edit the IDs below or use the settings UI.
//   1  Casual Duel       10 Ranked Duel
//   2  Casual Doubles    11 Ranked Doubles
//   3  Casual Standard   13 Ranked Standard
//   4  Casual Chaos      27 Hoops
//  28  Rumble            29 Dropshot
//  30  Snow Day          34 Tournament
tyl_playlists "10,11,13"

// Seconds to wait after match end before quitting.
tyl_delay_seconds 3

// 0 = clean quit (recommended), 1 = TerminateProcess.
tyl_force_quit 0
